name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly, to catch dead links and removed screenshots

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pages are up to date with tools/styles.py
        run: |
          python3 tools/build.py
          git diff --exit-code -- README.md README.zh-CN.md styles

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # tigsource and poly.pizza block automated requests; the demos on Pages deploy after this check runs
          args: --no-progress --max-retries 3 --exclude 'forums\.tigsource\.com' --exclude 'poly\.pizza' --exclude 'homkathon\.github\.io' README.md README.zh-CN.md CONTRIBUTING.md 'styles/**/README.md'
          fail: true
