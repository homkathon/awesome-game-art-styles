<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1-bit demo</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #000; } canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
// 1-bit: render normally at low resolution, then a post pass turns brightness into two colours with an ordered
// (Bayer 8x8) dither, and draws dark edges where depth jumps.
import * as THREE from 'three';
import { buildScene, makeCamera, animate, label } from './common.js';

const HEIGHT = 300;
const { scene, hero } = buildScene(color => new THREE.MeshLambertMaterial({ color }));
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const camera = makeCamera(1);

const target = new THREE.WebGLRenderTarget(1, 1, { depthTexture: new THREE.DepthTexture(1, 1) });
const post = new THREE.ShaderMaterial({
  uniforms: {
    scene: { value: target.texture }, depth: { value: target.depthTexture }, size: { value: new THREE.Vector2() },
    ink: { value: new THREE.Color('#1b1a2e') }, paper: { value: new THREE.Color('#e8e2c8') },
  },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `uniform sampler2D scene; uniform sampler2D depth; uniform vec2 size; uniform vec3 ink; uniform vec3 paper;
    varying vec2 vUv;
    float d(vec2 o) { return texture2D(depth, vUv + o / size).r; }
    void main() {
      vec3 c = texture2D(scene, vUv).rgb;
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      // 8x8 Bayer threshold, built from three 2x2 levels
      vec2 p = floor(vUv * size);
      vec2 a = mod(p, 2.0), b = mod(floor(p / 2.0), 2.0), e = mod(floor(p / 4.0), 2.0);
      float t = (4.0 * (2.0 * a.x + a.y * 3.0 - 4.0 * a.x * a.y) + 2.0 * (2.0 * b.x + b.y * 3.0 - 4.0 * b.x * b.y)
                 + (2.0 * e.x + e.y * 3.0 - 4.0 * e.x * e.y)) / 64.0 + 0.5 / 64.0;
      float on = step(t, l * 1.15 - 0.05);
      float z = d(vec2(0.0));
      float edge = abs(d(vec2(1.0, 0.0)) - z) + abs(d(vec2(0.0, 1.0)) - z);
      on *= 1.0 - step(0.0015, edge);
      gl_FragColor = vec4(mix(ink, paper, on), 1.0);
    }`,
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post);
const postScene = new THREE.Scene();
postScene.add(quad);
const orthoCam = new THREE.Camera();

const resize = () => {
  const w = Math.round(HEIGHT * innerWidth / innerHeight);
  renderer.setSize(w, HEIGHT, false);
  target.setSize(w, HEIGHT);
  post.uniforms.size.value.set(w, HEIGHT);
  camera.aspect = w / HEIGHT; camera.updateProjectionMatrix();
};
addEventListener('resize', resize); resize();
label('1-bit', 'https://github.com/homkathon/awesome-opus-game-art-styles/tree/main/styles/1-bit');
renderer.setAnimationLoop(ms => {
  animate(camera, hero, ms / 1000);
  renderer.setRenderTarget(target); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, orthoCam);
});
</script>
</body>
</html>
